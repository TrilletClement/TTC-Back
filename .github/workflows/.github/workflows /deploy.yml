name: Deploy to Server

on:
  push:
    branches:
      - main  # Se déclenche sur push vers main
  workflow_dispatch:  # Permet aussi déclenchement manuel

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Trigger deployment on server
        run: |
          curl -X POST "https://votre-domaine.com/api/deploy/webhook" \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: sha256=$(echo -n '{}' | openssl dgst -sha256 -hmac "${{ secrets.DEPLOY_SECRET }}" | cut -d' ' -f2)" \
            -d '{}'
        env:
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
      
      - name: Wait for deployment
        run: sleep 10
      
      - name: Check deployment status
        run: |
          curl -s "https://votre-domaine.com/api/deploy/status" | jq .

name: Deploy to Server

on:
  push:
    branches:
      - main  # Déclenche le workflow sur push vers main
  workflow_dispatch: # Permet aussi déclenchement manuel

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Déclenche le déploiement sur ton serveur via le webhook
      - name: Trigger deployment on server
        run: |
          curl -X POST "https://votre-domaine.com/api/deploy/webhook" \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: sha256=$(echo -n '{}' | openssl dgst -sha256 -hmac "${{ secrets.DEPLOY_SECRET }}" | cut -d' ' -f2)" \
            -d '{}'
        env:
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}

      # Attendre quelques secondes pour que le déploiement commence
      - name: Wait for deployment
        run: sleep 10

      # Vérifier le statut du déploiement via ton endpoint
      - name: Check deployment status
        run: |
          curl -s "https://transport.trillet.be/api/deploy/status" | jq .

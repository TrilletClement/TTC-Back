name: Build and Deploy

on:
  push:
    branches:
      - master  # Changé de main à master pour correspondre à ton repo
  workflow_dispatch: # Permet de lancer le build manuellement pour tester

jobs:
  build-and-trigger:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js (Build Angular)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and Build Angular
        run: |
          cd stibFront
          npm install
          npm run build -- --configuration production

      - name: Create Artifact
        run: |
          # REMPLACE 'votre-nom-de-projet' par le nom du dossier dans stibFront/dist/
          # Si Angular génère directement les fichiers dans dist/, utilise : -C stibFront/dist .
          tar -czf build-angular.tar.gz -C stibFront/dist/votre-nom-de-projet .

      - name: Upload Build to Server via SSH
        uses: appleboy/scp-action@master
        with:
          host: transport.trillet.be
          username: c.trillet
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "build-angular.tar.gz"
          target: "/home/c.trillet/"

      - name: Trigger FastAPI Webhook
        run: |
          PAYLOAD='{}'
          SIGNATURE=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "${{ secrets.DEPLOY_SECRET }}" | cut -d' ' -f2)
          curl -X POST "https://transport.trillet.be/api/deploy/webhook" \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: sha256=$SIGNATURE" \
            -d "$PAYLOAD"

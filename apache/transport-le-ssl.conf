# /etc/apache2/sites-available/transport-le-ssl.conf
# Deploy to 192.168.14.150
#
# Domain layout:
#   trillet.be            → redirect to https://transport.trillet.be
#   transport.trillet.be  → website + admin API  (no client cert)
#   esp.trillet.be        → ESP device endpoints  (mTLS, optional_no_ca)
#
# First-time setup:
#   1. Add DNS A records: trillet.be and esp.trillet.be → this server's IP
#   2. Deploy this file, then obtain the two new certs:
#        sudo certbot certonly --apache -d trillet.be
#        sudo certbot certonly --apache -d esp.trillet.be
#   3. sudo a2enmod ssl headers proxy proxy_http rewrite
#      sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Cert renewal is automatic via certbot's systemd timer.

# ── HTTP: redirect everything to HTTPS ───────────────────────────────────────
<VirtualHost *:80>
    ServerName trillet.be
    Redirect permanent / https://transport.trillet.be/
</VirtualHost>

<VirtualHost *:80>
    ServerName transport.trillet.be
    ServerAlias www.transport.trillet.be
    Redirect permanent / https://transport.trillet.be/
</VirtualHost>

<VirtualHost *:80>
    ServerName esp.trillet.be
    # No redirect — ESP devices use HTTPS directly.
    # This vhost exists only so certbot can complete the HTTP-01 ACME challenge.
    DocumentRoot /var/www/html
</VirtualHost>

<IfModule mod_ssl.c>

# ── trillet.be: redirect to transport.trillet.be ─────────────────────────────
<VirtualHost *:443>
    ServerName trillet.be

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/trillet.be/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/trillet.be/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    Redirect permanent / https://transport.trillet.be/

    ErrorLog  ${APACHE_LOG_DIR}/trillet_error.log
    CustomLog ${APACHE_LOG_DIR}/trillet_access.log combined
</VirtualHost>


# ── transport.trillet.be: website + admin API (humans) ───────────────────────
<VirtualHost *:443>
    ServerName transport.trillet.be
    ServerAlias www.transport.trillet.be

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/transport.trillet.be/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/transport.trillet.be/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # No SSLVerifyClient — browsers never see a certificate picker.

    ErrorLog  ${APACHE_LOG_DIR}/transport_error.log
    CustomLog ${APACHE_LOG_DIR}/transport_access.log combined

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Ssl on
    ProxyPreserveHost On

    # Security headers (mod_headers). geolocation=self: the line wizard's
    # "use my location". No CSP yet: Bootstrap CDN, Turnstile, Stripe and GTM
    # need a report-only rollout first.
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=(self)"

    ProxyPass /api/ http://192.168.14.14:8000/api/
    ProxyPassReverse /api/ http://192.168.14.14:8000/api/

    # Blog artifact embeds & cover images (FastAPI StaticFiles mount, see
    # main.py) — must reach the api container directly. Without this rule
    # it falls through to the catch-all below, hits the frontend's nginx,
    # and its SPA try_files fallback serves index.html instead of the
    # uploaded file (wrong content, silently redirects to home).
    ProxyPass /static/ http://192.168.14.14:8000/static/
    ProxyPassReverse /static/ http://192.168.14.14:8000/static/

    ProxyPass / http://192.168.14.14:4200/
    ProxyPassReverse / http://192.168.14.14:4200/

    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*) ws://192.168.14.14:4200/$1 [P,L]
</VirtualHost>


# ── esp.trillet.be: ESP device endpoints only (mTLS) ─────────────────────────
<VirtualHost *:443>
    ServerName esp.trillet.be

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/esp.trillet.be/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/esp.trillet.be/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # Request a client cert but skip CA chain verification —
    # FastAPI gates on X-Client-Cert-Verified == GENEROUS.
    SSLVerifyClient optional_no_ca
    SSLOptions +StdEnvVars

    RequestHeader set X-Client-Cert-Verified "%{SSL_CLIENT_VERIFY}s"
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Ssl on
    ProxyPreserveHost On

    ProxyPass /api/esp/    http://192.168.14.14:8000/api/esp/
    ProxyPassReverse /api/esp/    http://192.168.14.14:8000/api/esp/

    ProxyPass /api/update/ http://192.168.14.14:8000/api/update/
    ProxyPassReverse /api/update/ http://192.168.14.14:8000/api/update/

    ErrorLog  ${APACHE_LOG_DIR}/esp_device_error.log
    CustomLog ${APACHE_LOG_DIR}/esp_device_access.log combined
</VirtualHost>

</IfModule>

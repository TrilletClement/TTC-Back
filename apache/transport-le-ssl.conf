# /etc/apache2/sites-available/transport-le-ssl.conf
# Deploy to 192.168.14.150 — Apache handles TLS + mTLS for device endpoints.
#
# After updating this file on the server:
#   sudo a2enmod ssl headers proxy proxy_http rewrite
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Required before enabling mTLS:
#   sudo mkdir -p /etc/ssl/device-ca
#   sudo cp <ca-chain.pem from 192.168.14.14:/root/ca/intermediate/certs/ca-chain.pem> \
#            /etc/ssl/device-ca/ca-chain.pem
#   sudo chmod 644 /etc/ssl/device-ca/ca-chain.pem

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName transport.trillet.be
    ServerAlias www.transport.trillet.be

    # ── Server TLS (Let's Encrypt) ────────────────────────────────────────────
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/transport.trillet.be/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/transport.trillet.be/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # ── Device client certificate (mTLS) ─────────────────────────────────────
    # optional at VirtualHost level: non-device requests (browser, Angular app)
    # work without a client cert. Device endpoints enforce require per-Location.
    SSLVerifyClient optional
    SSLCACertificateFile /etc/ssl/device-ca/ca-chain.pem
    SSLVerifyDepth 2

    # Export cert variables so they can be injected as request headers.
    SSLOptions +StdEnvVars

    # Forward cert identity to the FastAPI backend for every request.
    # FastAPI's get_device_from_cert() reads these headers.
    # SSL_CLIENT_VERIFY is "SUCCESS", "NONE", or "FAILED:reason"
    RequestHeader set X-Client-Cert-Fingerprint "%{SSL_CLIENT_FINGERPRINT}s"
    RequestHeader set X-Client-Cert-Verified    "%{SSL_CLIENT_VERIFY}s"
    RequestHeader set X-Client-Cert-Subject     "%{SSL_CLIENT_S_DN}s"

    # ── Logging ───────────────────────────────────────────────────────────────
    ErrorLog ${APACHE_LOG_DIR}/transport_error.log
    CustomLog ${APACHE_LOG_DIR}/transport_access.log combined

    # ── Proxy headers ─────────────────────────────────────────────────────────
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Ssl on
    ProxyPreserveHost On

    # ── Device endpoints: client certificate REQUIRED ─────────────────────────
    # FastAPI also validates the cert via get_device_from_cert() as a second
    # layer, but Apache blocks uncertified requests before they reach the app.

    <Location "/api/update/">
        SSLVerifyClient require
        SSLVerifyDepth 2
        ProxyPass http://192.168.14.14:8000/api/update/
        ProxyPassReverse http://192.168.14.14:8000/api/update/
    </Location>

    <Location "/api/esp/">
        SSLVerifyClient require
        SSLVerifyDepth 2
        ProxyPass http://192.168.14.14:8000/api/esp/
        ProxyPassReverse http://192.168.14.14:8000/api/esp/
    </Location>

    # ── All other API routes: no client cert required ─────────────────────────
    ProxyPass /api/ http://192.168.14.14:8000/api/
    ProxyPassReverse /api/ http://192.168.14.14:8000/api/

    # ── Angular frontend ──────────────────────────────────────────────────────
    ProxyPass / http://192.168.14.14:4200/
    ProxyPassReverse / http://192.168.14.14:4200/

    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*) ws://192.168.14.14:4200/$1 [P,L]

</VirtualHost>
</IfModule>

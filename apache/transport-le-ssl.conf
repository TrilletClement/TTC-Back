# /etc/apache2/sites-available/transport-le-ssl.conf
# Deploy to 192.168.14.150 — Apache handles TLS + mTLS for device endpoints.
#
# After updating this file on the server:
#   sudo a2enmod ssl headers proxy proxy_http rewrite
#   sudo apache2ctl configtest && sudo systemctl reload apache2

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName transport.trillet.be
    ServerAlias www.transport.trillet.be

    # ── Server TLS (Let's Encrypt) ────────────────────────────────────────────
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/transport.trillet.be/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/transport.trillet.be/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # ── Device client certificate (mTLS) ─────────────────────────────────────
    # Request a cert from every client but skip CA chain verification at the
    # TLS layer — avoids the TLS 1.3 fatal-alert that fires when no CA chain
    # is configured. SSL_CLIENT_VERIFY = GENEROUS when a cert is presented.
    # Device endpoint access is enforced below via Require expr.
    SSLVerifyClient optional_no_ca
    SSLOptions +StdEnvVars

    # %{SSL_CLIENT_VERIFY}s reads from mod_ssl's notes table (set during the
    # auth phase, before mod_headers fixup) — this one header works reliably.
    RequestHeader set X-Client-Cert-Verified "%{SSL_CLIENT_VERIFY}s"

    # ── Logging ───────────────────────────────────────────────────────────────
    ErrorLog ${APACHE_LOG_DIR}/transport_error.log
    CustomLog ${APACHE_LOG_DIR}/transport_access.log combined

    # ── Proxy headers ─────────────────────────────────────────────────────────
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Ssl on
    ProxyPreserveHost On

    # ── Device endpoints ─────────────────────────────────────────────────────
    # Apache forwards X-Client-Cert-Verified (GENEROUS/NONE) so FastAPI can
    # gate on cert presence. Apache itself does not block — every attempt to
    # gate via SSLRequire / Require expr in a <Location> block has blocked
    # all requests including cert-bearing ones (SSL variable hook ordering
    # issue in <Location>+ProxyPass). Auth is handled entirely by FastAPI:
    #   - /api/esp/ and /api/update/versions: require X-Device-Mac header
    #   - /api/update/package/: require X-Client-Cert-Verified == GENEROUS

    <Location "/api/update/">
        ProxyPass http://192.168.14.14:8000/api/update/
        ProxyPassReverse http://192.168.14.14:8000/api/update/
    </Location>

    <Location "/api/esp/">
        ProxyPass http://192.168.14.14:8000/api/esp/
        ProxyPassReverse http://192.168.14.14:8000/api/esp/
    </Location>

    # ── All other API routes ──────────────────────────────────────────────────
    ProxyPass /api/ http://192.168.14.14:8000/api/
    ProxyPassReverse /api/ http://192.168.14.14:8000/api/

    # ── Angular frontend ──────────────────────────────────────────────────────
    ProxyPass / http://192.168.14.14:4200/
    ProxyPassReverse / http://192.168.14.14:4200/

    # ── WebSocket passthrough ─────────────────────────────────────────────────
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*) ws://192.168.14.14:4200/$1 [P,L]

</VirtualHost>
</IfModule>

# nginx reverse proxy with optional mTLS for device endpoints.
#
# Adjust DOMAIN below to match your production domain.
# Let's Encrypt certs are expected at /etc/letsencrypt/live/<DOMAIN>/.
# CA chain is mounted at /etc/device-ca/ca-chain.pem (see docker-compose.yml).

upstream fastapi {
    server api:8000;
    keepalive 32;
}

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    # Allow Certbot ACME challenges through
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name transport.trillet.be;  # ← change if domain changes

    # Server TLS (Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/transport.trillet.be/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/transport.trillet.be/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Client certificate — optional at TLS level.
    # Specific locations enforce SUCCESS via the `if` blocks below.
    ssl_verify_client optional;
    ssl_client_certificate /etc/device-ca/ca-chain.pem;
    ssl_verify_depth 2;

    # Common proxy headers (applied in every location)
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    # ── Device endpoints — client certificate required ───────────────────────
    # Covers: /api/update/* and /api/esp/*
    location ~ ^/api/(update|esp)/ {
        if ($ssl_client_verify != "SUCCESS") {
            return 403 '{"detail":"Client certificate required"}';
        }

        # Forward cert identity to FastAPI (trusted because uvicorn only
        # accepts connections from nginx on the Docker internal network)
        proxy_set_header X-Client-Cert-Fingerprint $ssl_client_fingerprint;
        proxy_set_header X-Client-Cert-Subject     $ssl_client_s_dn;
        proxy_set_header X-Client-Cert-Verified    $ssl_client_verify;

        proxy_pass http://fastapi;
        proxy_read_timeout 30s;
    }

    # ── Provisioning — no client cert (device doesn't have one yet) ──────────
    # Protected by HOME_SERVER_SECRET in the Authorization header (FastAPI).
    location /api/provisioning/ {
        proxy_pass http://fastapi;
        proxy_read_timeout 30s;
    }

    # ── Everything else — no client cert required ─────────────────────────────
    location / {
        proxy_pass http://fastapi;
        proxy_read_timeout 60s;
    }
}

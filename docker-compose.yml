services:
  db:
    image: postgres:15-alpine
    restart: always
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"

  api:
    build:
      context: ./fastapi-server # ← Build depuis fastapi-server
      dockerfile: Dockerfile
    image: stib-api:latest
    restart: always
    depends_on:
      - db
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - PYTHONPATH=/app
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4

  scheduler:
    image: stib-api:latest
    restart: always
    depends_on:
      - db
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - PYTHONPATH=/app
    command: python -m app.routines.scheduler

  frontend:
    image: server-stib-frontend:latest
    build:
      context: ./stibFront
      dockerfile: Dockerfile
    restart: always
    ports:
      - "4200:80"
    volumes:
      - ./env.js:/usr/share/nginx/html/assets/env.js
      - ./stibFront/public/runtime-env.js:/usr/share/nginx/html/runtime-env.js
    depends_on:
      - api

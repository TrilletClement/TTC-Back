services:
  db:
    image: postgres:15-alpine
    restart: always
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"

  api:
    build:
      context: ./fastapi-server
      dockerfile: Dockerfile
    image: stib-api:latest
    restart: always
    depends_on:
      - db
    env_file: .env
    environment:
      - DB_HOST=db
      - PYTHONPATH=/app
    # Port 8000 exposed to host — Apache on 192.168.14.150 proxies to it.
    ports:
      - "8000:8000"
    volumes:
      - ./firmware_packages:/data/firmware
      # Intermediate CA key + cert — used by FastAPI to sign device certs.
      # Created by ca/setup-ca.sh; never committed to git.
      - ./ca/intermediate/private/inter.key:/etc/device-ca/inter.key:ro
      - ./ca/intermediate/certs/inter.crt:/etc/device-ca/inter.crt:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4

  scheduler:
    image: stib-api:latest
    restart: always
    depends_on:
      - db
    env_file: .env
    environment:
      - DB_HOST=db
      - PYTHONPATH=/app
    volumes:
      - ./firmware_packages:/data/firmware
    command: python -m app.routines.scheduler

  frontend:
    image: server-stib-frontend:latest
    build:
      context: ./stibFront
      dockerfile: Dockerfile
    restart: always
    ports:
      - "4200:80"
    volumes:
      - ./env.js:/usr/share/nginx/html/assets/env.js
      - ./stibFront/public/runtime-env.js:/usr/share/nginx/html/runtime-env.js
    depends_on:
      - api
